# Berrux SD card image for the Raspberry Pi 5.
#
# Partition 1 is the FAT boot partition the EEPROM bootloader reads.
# Partition 2 is the ext4 root filesystem; the kernel finds it by its
# "berrux-root" label, so the image boots from SD or USB without changes.

image boot.vfat {
	vfat {
		files = {
			"config.txt",
			"cmdline.txt",
			"Image",
			# All three are built and shipped because the board revision
			# decides which one is correct. config.txt picks one.
			"bcm2712-rpi-5-b.dtb",
			"bcm2712d0-rpi-5-b.dtb",
			"bcm2712-rpi-500.dtb"
		}
	}

	size = 64M
}

image berrux-pi5.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
