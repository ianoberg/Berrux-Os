# Berrux SD card image for the Raspberry Pi 5.
#
# Partition 1 is the FAT boot partition the EEPROM bootloader reads.
# Partition 2 is the ext4 root filesystem, mounted from /dev/mmcblk0p2.

image boot.vfat {
	vfat {
		files = {
			"config.txt",
			"cmdline.txt",
			"Image",
			"bcm2712-rpi-5-b.dtb"
		}
	}

	size = 64M
}

image berrux-pi5.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
